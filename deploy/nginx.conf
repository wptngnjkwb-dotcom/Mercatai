# Maps the Supabase URL convention (/rest/v1/*) onto plain PostgREST,
# so the app's supabase-js client works unchanged against the local stack.
server {
    listen 80;

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
