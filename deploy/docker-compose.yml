# Mercatai — self-hosted stack. See docs/self-hosting.md for the full guide.
#
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
#
# Services:
#   db       PostgreSQL 15 with the Mercatai schema
#   rest     PostgREST — the same REST layer Supabase provides
#   gateway  nginx — maps /rest/v1/* to PostgREST (Supabase URL convention)
#   app      Next.js frontend + API
#   cron     curl sidecar firing the scheduled jobs (escrow release, SLA refund)

services:
  db:
    # pgvector build — the schema uses the "vector" extension
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: mercatai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      # The canonical SQL lives in backend/db/ and frontend/sql/ and is
      # mounted straight in — no copies to keep in sync. Postgres runs these
      # in filename order, hence the numeric prefixes on the targets.
      # Note: they run only when the db_data volume is empty (first boot).
      # An existing installation must apply new migrations by hand.
      - ./init/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
      - ../frontend/sql/03_agent_value.sql:/docker-entrypoint-initdb.d/20_agent_value.sql:ro
      - ../frontend/sql/04_buyer_protection.sql:/docker-entrypoint-initdb.d/21_buyer_protection.sql:ro
      - ../frontend/sql/05_finance_category.sql:/docker-entrypoint-initdb.d/22_finance_category.sql:ro
      - ../frontend/sql/06_admin_backoffice.sql:/docker-entrypoint-initdb.d/23_admin_backoffice.sql:ro
      - ../frontend/sql/07_demo_tasks.sql:/docker-entrypoint-initdb.d/24_demo_tasks.sql:ro
      - ../frontend/sql/08_agent_store.sql:/docker-entrypoint-initdb.d/25_agent_store.sql:ro
      - ../frontend/sql/09_agent_auth_columns.sql:/docker-entrypoint-initdb.d/26_agent_auth_columns.sql:ro
      - ../frontend/sql/10_payment_pending_status.sql:/docker-entrypoint-initdb.d/27_payment_pending_status.sql:ro
      - ../frontend/sql/11_task_moderation.sql:/docker-entrypoint-initdb.d/28_task_moderation.sql:ro
      - ../frontend/sql/12_agent_profile_visibility.sql:/docker-entrypoint-initdb.d/29_agent_profile_visibility.sql:ro
      - ../frontend/sql/13_bid_sample_and_delivery_note.sql:/docker-entrypoint-initdb.d/30_bid_sample_and_delivery_note.sql:ro
      - ../frontend/sql/14_stripe_connect_monitoring.sql:/docker-entrypoint-initdb.d/31_stripe_connect_monitoring.sql:ro
      - ../frontend/sql/15_task_archival.sql:/docker-entrypoint-initdb.d/32_task_archival.sql:ro
      - ../frontend/sql/16_atomic_task_delivery.sql:/docker-entrypoint-initdb.d/33_atomic_task_delivery.sql:ro
      - ../frontend/sql/17_payment_integrity_hardening.sql:/docker-entrypoint-initdb.d/34_payment_integrity_hardening.sql:ro
      - ../frontend/sql/18_payment_charge_identity_and_disputes.sql:/docker-entrypoint-initdb.d/35_payment_charge_identity_and_disputes.sql:ro
      - ../frontend/sql/19_restrict_service_role_rpcs.sql:/docker-entrypoint-initdb.d/36_restrict_service_role_rpcs.sql:ro
      - ../frontend/sql/20_payment_charge_transfer_identity.sql:/docker-entrypoint-initdb.d/37_payment_charge_transfer_identity.sql:ro
      - ../frontend/sql/21_direct_charges.sql:/docker-entrypoint-initdb.d/38_direct_charges.sql:ro
      - ../frontend/sql/22_quality_issue_facilitation.sql:/docker-entrypoint-initdb.d/39_quality_issue_facilitation.sql:ro
      - ../frontend/sql/23_opportunity_alerts.sql:/docker-entrypoint-initdb.d/40_opportunity_alerts.sql:ro
      - ../frontend/sql/24_standard_accounts_and_pilot_express.sql:/docker-entrypoint-initdb.d/41_standard_accounts.sql:ro
      - ../frontend/sql/25_restore_transaction_pending_states.sql:/docker-entrypoint-initdb.d/42_restore_transaction_pending_states.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercatai"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/mercatai
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - rest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Points supabase-js at the local gateway instead of supabase.co
      SUPABASE_URL: http://gateway
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      # Without these the Payment Element config endpoint and the payment
      # webhook both answer 503 — the buyer cannot pay at all.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # Falls back to the reviewed EU/EEA + UK Direct Charges rollout set
      # inside the app when unset — see stripeConnectCountries.ts.
      STRIPE_CONNECT_ENABLED_COUNTRIES: ${STRIPE_CONNECT_ENABLED_COUNTRIES:-}
      # SEPARATE, fail-closed gate on actually creating a new Direct Charge
      # payment — defaults to empty (permits none) when unset, unlike
      # STRIPE_CONNECT_ENABLED_COUNTRIES above. See stripeConnectCountries.ts.
      STRIPE_DIRECT_CHARGE_COUNTRIES: ${STRIPE_DIRECT_CHARGE_COUNTRIES:-}
      # Signing secret of the SEPARATE Connect webhook endpoint
      # (/api/v1/payments/stripe-connect-webhook) — a production Stripe
      # event destination for "events on connected accounts" can have its
      # own secret, independent of STRIPE_WEBHOOK_SECRET above. It must
      # include account/payout monitoring plus the payment_intent.* and
      # charge.dispute.* events listed in the payment-webhook runbook.
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Where payout-failure and moderation alerts are sent. Without it,
      # those alerts are only logged (see frontend/lib/server/email.ts).
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      CRON_SECRET: ${CRON_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      # Optional error tracking — see docs/self-hosting.md §7. Empty and no
      # Sentry client is ever created, so no telemetry is ever sent.
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      # 0-1, defaults to 0 (no performance tracing) if unset/invalid.
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-}

  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: /bin/sh
    # Escrow release 02:00 and SLA refund 03:00 match vercel.json. The
    # opportunity-alert retry runs hourly here, but only once a day (04:07)
    # in vercel.json: Vercel's Hobby plan fails the whole deployment on any
    # cron that would fire more than once per day.
    command:
      - -c
      - |
        echo '0 2 * * * curl -fsS -H "Authorization: Bearer '"$$CRON_SECRET"'" http://app:3000/api/cron/release-escrow' >  /tmp/crontab
        echo '0 3 * * * curl -fsS -H "Authorization: Bearer '"$$CRON_SECRET"'" http://app:3000/api/cron/sla-refund'     >> /tmp/crontab
        echo '7 * * * * curl -fsS -H "Authorization: Bearer '"$$CRON_SECRET"'" http://app:3000/api/cron/opportunity-alerts' >> /tmp/crontab
        crontab /tmp/crontab
        crond -f -l 2

volumes:
  db_data:
